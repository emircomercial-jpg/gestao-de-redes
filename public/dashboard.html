<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard - Métricas</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>body{font-family:Arial,Helvetica,sans-serif;margin:20px}canvas{max-width:900px}</style>
</head>
<body>
  <h1>Dashboard de Métricas</h1>
  <label>Tenant: <input id="tenant" value="default" /></label>
  <button id="refresh">Atualizar</button>
  <h2>Custos últimas 24h</h2>
  <canvas id="costChart"></canvas>
  <h2>Latência média (ms)</h2>
  <canvas id="latChart"></canvas>
  <h2>Alertas recentes</h2>
  <pre id="alerts"></pre>
  <script src="/dashboard.js"></script>
</body>
</html>
