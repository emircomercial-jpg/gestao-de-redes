name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Start server
        run: |
          node src/server.js &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start in time" >&2
          exit 1
      - name: Run tests
        run: npm test --silent
      - name: Stop server
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: user/social-automation:ci
      - name: Upload image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-metadata
          path: |
            $(pwd)/.docker/buildx